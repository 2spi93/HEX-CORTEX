services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: hex-cortex-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    security_opt:
      - no-new-privileges:true

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: hex-cortex-crawl4ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: 1g
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-cache:
