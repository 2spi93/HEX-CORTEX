services:
  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    container_name: hex-cortex-api
    restart: unless-stopped
    network_mode: host
    environment:
      HEX_CORTEX_API_HOST: 127.0.0.1
      HEX_CORTEX_API_PORT: 8765
      HEX_CORTEX_PROFILE: /data/.hex-cortex
      HEX_CORTEX_FEDERATION_SIGNING_KEY: ${HEX_CORTEX_FEDERATION_SIGNING_KEY:?set signing key}
      HEX_CORTEX_TELEGRAM_WEBHOOK_SECRET: ${HEX_CORTEX_TELEGRAM_WEBHOOK_SECRET:-}
      HEX_CORTEX_INTERNAL_API_AVAILABLE: "true"
      HEX_CORTEX_HTTPS_REVERSE_PROXY_AVAILABLE: ${HEX_CORTEX_HTTPS_REVERSE_PROXY_AVAILABLE:-false}
      HEX_CORTEX_PRIVATE_OR_TUNNELED_TRANSPORT_AVAILABLE: ${HEX_CORTEX_PRIVATE_OR_TUNNELED_TRANSPORT_AVAILABLE:-false}
      HEX_CORTEX_SERVER_WORKER_QUEUE_AVAILABLE: "true"
      HEX_CORTEX_SIGNED_TASK_ENVELOPES_AVAILABLE: "true"
      HEX_CORTEX_REMOTE_RECEIPTS_AVAILABLE: "true"
      HEX_CORTEX_HERMES_AUTODISCOVERY_AVAILABLE: "true"
      HEX_CORTEX_GTIXT_READ_ONLY_AUDIT_AVAILABLE: "true"
    volumes:
      - cortex-profile:/data/.hex-cortex
    security_opt:
      - no-new-privileges:true

volumes:
  cortex-profile:
