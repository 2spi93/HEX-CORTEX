[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-cortex"
version = "0.1.0"
description = "Cellular world-model intelligence kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.scripts]
hexctl = "hex_cortex.memory.profile_control_cli:main"
hexnext = "hex_cortex.memory.profile_next_action_cli:main"
hexdispatch = "hex_cortex.memory.profile_next_action_dispatch_cli:main"
hexdispatch-history = "hex_cortex.memory.profile_dispatch_history_cli:main"
hexpreflight = "hex_cortex.memory.profile_dispatch_preflight_cli:main"
hexcortex = "hex_cortex.memory.cortex_cli:main"
hexcortex-mcp = "hex_cortex.memory.cortex_operational_stdio:serve_cortex_operational_stdio"
hexcortex-audit = "hex_cortex.memory.cortex_operational_audit_cli:main"
hexcortex-server = "hex_cortex.memory.cortex_server_api:serve"
hexcortex-wave = "hex_cortex.memory.cortex_next_wave_cli:main"
hexcortex-operational = "hex_cortex.memory.cortex_operational_media_cli:main"
hexcortex-media-latent = "hex_cortex.memory.cortex_media_to_latent_cli:main"
hexcortex-world-train = "hex_cortex.memory.cortex_world_training_cli:main"
hexcortex-env-router = "hex_cortex.memory.cortex_environment_router_cli:main"
hexcortex-agent = "hex_cortex.memory.cortex_agent_runtime_cli:main"
hexcortex-code = "hex_cortex.memory.cortex_coding_runtime_cli:main"
hexcortex-research = "hex_cortex.memory.cortex_research_runtime_cli:main"
hexcortex-evidence = "hex_cortex.memory.cortex_evidence_cli:main"
hexcortex-remote-smoke = "hex_cortex.memory.cortex_remote_api_smoke_cli:main"
hexcortex-n8n-rotation-cert = "hex_cortex.memory.cortex_n8n_rotation_certificate_cli:main"
hexcortex-service-decommission-cert = "hex_cortex.memory.cortex_service_decommission_certificate_cli:main"
hexcortex-genome = "hex_cortex.memory.cortex_cognitive_genome_cli_v2:main"
hexcortex-memory = "hex_cortex.memory.cortex_cognitive_memory_cli:main"
hexcortex-brains = "hex_cortex.memory.cortex_cognitive_brain_cli:main"
hexcortex-doctor = "hex_cortex.memory.cortex_environment_doctor_cli:main"
hexcortex-loop = "hex_cortex.memory.cortex_cognitive_loop_cli:main"
hexcortex-benchmark = "hex_cortex.memory.cortex_benchmark_runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
vision = [
  "Pillow>=10,<13",
  "transformers>=4.46,<6",
  "safetensors>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # The cortex rails intentionally contain generated JSON/HTML/string receipts,
  # one-import-per-symbol smoke tests, and compact declarative artifact emitters.
  # Keep semantic gates active while excluding formatting-only noise from the
  # default repository gate.
  "E401",
  "E501",
  "E701",
  "E702",
  "I001",
]

[tool.ruff.lint.per-file-ignores]
"src/hex_cortex/memory/cortex_ui_cockpit_builder.py" = [
  # The generated static HTML builder keeps the readiness snapshot in the render
  # scope for audit readability even when no direct template reference remains.
  "F841",
]
"src/hex_cortex/memory/cortex_environment_sequence.py" = [
  # Kept local to the new sequence rail until its callback type surface is exposed.
  "F401",
  "UP035",
]
"src/hex_cortex/memory/cortex_world_model_decision_router.py" = [
  # Callable is part of the injected model-runner contract on Python 3.11.
  "UP035",
]
