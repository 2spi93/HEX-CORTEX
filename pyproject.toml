[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-cortex"
version = "0.1.0"
description = "Cellular world-model intelligence kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.scripts]
hexctl = "hex_cortex.memory.profile_control_cli:main"
hexnext = "hex_cortex.memory.profile_next_action_cli:main"
hexdispatch = "hex_cortex.memory.profile_next_action_dispatch_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
