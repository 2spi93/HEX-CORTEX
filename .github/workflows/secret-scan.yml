name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        id: gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git \
            --redact=100 \
            --no-color \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            /repo
          status=$?

          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("gitleaks-report.json")
          rows = []
          if source.is_file():
              payload = json.loads(source.read_text(encoding="utf-8"))
              if isinstance(payload, list):
                  for item in payload:
                      if not isinstance(item, dict):
                          continue
                      rows.append(
                          {
                              "rule_id": item.get("RuleID"),
                              "description": item.get("Description"),
                              "file": item.get("File"),
                              "start_line": item.get("StartLine"),
                              "commit": item.get("Commit"),
                              "fingerprint": item.get("Fingerprint"),
                          }
                      )
          summary = {
              "scan_type": "gitleaks_safe_summary_v1",
              "finding_count": len(rows),
              "findings": rows,
              "secret_material_persisted": False,
              "raw_match_persisted": False,
          }
          Path("gitleaks-safe-summary.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

          rm -f gitleaks-report.json
          exit "$status"

      - name: Upload safe Gitleaks diagnostics
        if: failure() && steps.gitleaks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-safe-summary
          path: gitleaks-safe-summary.json
          if-no-files-found: error
          retention-days: 7
