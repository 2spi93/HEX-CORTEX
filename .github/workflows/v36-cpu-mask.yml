name: V36 CPU Mask Verification

on:
  push:
  pull_request:

jobs:
  pillow-cpu-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow and development dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "Pillow>=10,<13"
      - name: Ruff
        run: python -m ruff check .
      - name: Mandatory real pixel operations with injected masks, CPU only
        run: python -m pytest -q tests/test_cortex_object_layers_v35.py tests/test_cortex_cpu_segmentation_v36.py tests/test_cortex_object_scene_v36.py tests/test_cortex_segmentation_scene_bridge_v36.py tests/test_cortex_segmentation_scene_bridge_cli_v36.py tests/test_cortex_real_cpu_smoke_v37.py tests/test_cortex_real_photo_benchmark_v38.py tests/test_cortex_operator_receipt_audit_v39.py tests/test_cortex_mask_visual_inspection_v40.py tests/test_cortex_object_memory_staging_v41.py tests/test_cortex_visual_to_canonical_spine_v42.py
