name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          ruff check . --output-format=concise > ruff-output.txt 2>&1
          status=$?
          cat ruff-output.txt
          exit "$status"

      - name: Upload Ruff diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: pytest
