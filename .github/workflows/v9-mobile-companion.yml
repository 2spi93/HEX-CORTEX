name: V9 Mobile Companion — No Data Egress

on:
  push:
    paths:
      - "docs/companion/**"
      - "tests/test_cortex_android_companion_v9.py"
      - ".github/workflows/v9-mobile-companion.yml"
  pull_request:
    paths:
      - "docs/companion/**"
      - "tests/test_cortex_android_companion_v9.py"
      - ".github/workflows/v9-mobile-companion.yml"

permissions:
  contents: read

jobs:
  mobile-static-security:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test/lint only, no model and no GPU
        run: python -m pip install pytest ruff
      - name: Check privacy, controls, offline shell and PWA syntax
        run: python -m pytest -q tests/test_cortex_android_companion_v9.py
      - name: Run Ruff across repository
        run: python -m ruff check .
